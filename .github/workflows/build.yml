name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc

      - name: Build Library and Examples
        run: make

      - name: Run Basic Smoke Test
        run: |
          ./out/examples/basic | grep "Total segfaults caught:"

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: segmentation-guard-build
          path: |
            out/libsegmentation_guard.a
            out/libsegmentation_guard.so
            out/examples/
